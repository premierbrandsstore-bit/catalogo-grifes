<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://docs.google.com">
<link rel="preconnect" href="https://lh3.googleusercontent.com">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DR DAS GRIFES — Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper:      #ffffff;
    --paper-soft: #f4f3f1;
    --ink:        #111111;
    --ink-soft:   #555555;
    --muted:      #8e8b87;
    --line:       #e4e2de;
    --line-soft:  #efedea;

    /* Degradê do logo — usado SOMENTE na marca */
    --grad: linear-gradient(135deg, #2BC4F3 0%, #2B7FE8 32%, #8B3FD9 64%, #E8207C 100%);

    --font-logo: 'Bebas Neue', sans-serif;
    --font-body: 'DM Sans', -apple-system, sans-serif;

    --header-h: 60px;
    --side-w: 208px;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .eyebrow {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
  }

  /* ── HEADER ── */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 0 28px;
    height: var(--header-h);
    display: flex; align-items: center; justify-content: space-between;
  }

  .logo {
    font-family: var(--font-logo);
    font-size: 26px;
    letter-spacing: 5px;
    color: var(--ink);
    text-decoration: none;
    line-height: 1;
  }

  .logo em {
    font-style: normal;
    background-image: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .cart-btn {
    background: none;
    border: none;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 6px 0;
    display: flex; align-items: center; gap: 7px;
    transition: opacity 0.2s;
  }
  .cart-btn:hover { opacity: 0.55; }
  .cart-count { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ── SHELL: SIDEBAR + CONTEÚDO ── */
  .shell {
    margin-top: var(--header-h);
    display: flex;
    align-items: flex-start;
  }

  .sidebar {
    width: var(--side-w);
    flex-shrink: 0;
    position: sticky;
    top: var(--header-h);
    height: calc(100vh - var(--header-h));
    overflow-y: auto;
    border-right: 1px solid var(--line);
    padding: 30px 0 30px 28px;
  }

  .search-box {
    width: calc(100% - 28px);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 0.06em;
    padding: 0 0 8px;
    outline: none;
    margin-bottom: 30px;
    transition: border-color 0.2s;
  }
  .search-box::placeholder { color: var(--muted); }
  .search-box:focus { border-color: var(--ink); }

  .side-label { margin-bottom: 14px; }

  .cat-list { display: flex; flex-direction: column; align-items: flex-start; }

  .cat-item {
    background: none;
    border: none;
    border-left: 1px solid transparent;
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 7px 0 7px 11px;
    text-align: left;
    transition: color 0.18s, border-color 0.18s;
  }
  .cat-item:hover { color: var(--ink); }
  .cat-item.active {
    color: var(--ink);
    font-weight: 500;
    border-left-color: var(--ink);
  }

  /* ── FILTRO DE TAMANHO ── */
  .size-block { margin-top: 34px; display: none; }
  .size-block.show { display: block; }

  .size-head {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 12px;
    padding-right: 28px;
  }

  .size-clear {
    background: none; border: none;
    font-family: var(--font-body);
    font-size: 9px; letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer; padding: 0;
    text-decoration: underline;
    display: none;
  }
  .size-clear.show { display: inline; }
  .size-clear:hover { color: var(--ink); }

  .size-filter {
    display: flex; flex-wrap: wrap; gap: 5px;
    padding-right: 28px;
  }

  .size-chip {
    min-width: 34px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    font-family: var(--font-body);
    font-size: 11px; font-weight: 300;
    letter-spacing: 0.06em;
    padding: 6px 7px;
    cursor: pointer;
    transition: all 0.16s;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .size-chip:hover { border-color: var(--ink); color: var(--ink); }
  .size-chip.active {
    background: var(--ink); border-color: var(--ink);
    color: var(--paper); font-weight: 400;
  }

  /* ── CATÁLOGO ── */
  .catalog {
    flex: 1;
    min-width: 0;
    padding: 30px 28px 80px;
  }

  .catalog-head {
    display: flex; align-items: baseline; gap: 14px;
    margin-bottom: 26px;
    min-height: 16px;
  }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    column-gap: 22px;
    row-gap: 46px;
  }

  .product-card { cursor: pointer; }

  .card-media {
    background: var(--paper-soft);
    aspect-ratio: 3/4;
    overflow: hidden;
    position: relative;
  }

  .card-media img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.7s cubic-bezier(0.2,0,0.2,1);
  }

  .product-card:hover .card-media img { transform: scale(1.04); }

  .card-meta { padding-top: 12px; }

  .card-brand {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
    line-height: 1.3;
  }

  .card-cat {
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 3px;
  }

  .card-size {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 5px;
  }

  .card-price {
    font-size: 12px;
    font-weight: 400;
    color: var(--ink);
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }
  .card-price.consult { color: var(--muted); font-weight: 300; }

  .no-results {
    grid-column: 1/-1;
    text-align: center;
    padding: 90px 0;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* botão genérico (usado no erro de carregamento) */
  .btn-ghost {
    background: none;
    border: 1px solid var(--ink);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 9px 20px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-ghost:hover { background: var(--ink); color: var(--paper); }

  /* ── MODAL PRODUTO ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--paper);
    border: 1px solid var(--line);
    max-width: 860px; width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    position: relative;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 700px) {
    .modal { grid-template-columns: 1fr; }
  }

  .modal-img {
    width: 100%; aspect-ratio: 3/4;
    object-fit: cover;
    background: var(--paper-soft);
  }

  .modal-content { padding: 40px 36px; display: flex; flex-direction: column; }

  .modal-close {
    position: absolute; top: 14px; right: 14px;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink);
    width: 32px; height: 32px;
    font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .modal-close:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .modal-name {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.14em;
    line-height: 1.2;
    color: var(--ink);
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  .modal-cat {
    font-size: 10px; color: var(--muted);
    letter-spacing: 0.2em; text-transform: uppercase;
    margin-bottom: 22px;
  }

  .modal-cor {
    font-size: 12px; color: var(--muted);
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .modal-cor strong { color: var(--ink); font-weight: 400; }

  .modal-ref {
    font-size: 11px; color: var(--muted);
    letter-spacing: 0.04em;
    margin-bottom: 22px;
  }

  .modal-price {
    font-size: 20px; font-weight: 400;
    color: var(--ink);
    margin-bottom: 30px;
    font-variant-numeric: tabular-nums;
  }

  .modal-label {
    font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 10px;
  }

  .sizes-grid {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 26px;
  }

  .size-btn {
    border: 1px solid var(--line);
    background: transparent; color: var(--ink);
    font-family: var(--font-body);
    font-size: 11px; font-weight: 300;
    padding: 8px 15px;
    cursor: pointer; transition: all 0.18s;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .size-btn:hover { border-color: var(--ink); }
  .size-btn.selected {
    background: var(--ink); border-color: var(--ink);
    color: var(--paper); font-weight: 400;
  }

  .qty-row {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 30px;
  }

  .qty-btn {
    width: 30px; height: 30px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink); font-size: 15px;
    cursor: pointer; transition: all 0.18s;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-btn:hover { border-color: var(--ink); }
  .qty-display { font-size: 14px; min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }

  .modal-add-btn {
    background: var(--ink); color: var(--paper);
    border: 1px solid var(--ink);
    font-family: var(--font-body);
    font-size: 11px; font-weight: 400;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 15px; cursor: pointer;
    transition: opacity 0.2s; margin-top: auto;
    width: 100%;
  }
  .modal-add-btn:hover { opacity: 0.82; }
  .modal-add-btn:disabled {
    background: var(--paper); color: var(--muted);
    border-color: var(--line); cursor: not-allowed; opacity: 1;
  }

  /* ── SACOLA ── */
  .cart-sidebar {
    position: fixed; top: 0; right: -420px; bottom: 0;
    width: 420px; max-width: 100vw;
    background: var(--paper);
    z-index: 300;
    transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
    display: flex; flex-direction: column;
    border-left: 1px solid var(--line);
  }
  .cart-sidebar.open { right: 0; }

  .cart-overlay-bg {
    position: fixed; inset: 0; z-index: 290;
    background: rgba(17,17,17,0.18);
    display: none;
  }
  .cart-overlay-bg.open { display: block; }

  .cart-header {
    padding: 22px 26px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }

  .cart-title {
    font-size: 11px; letter-spacing: 0.22em;
    text-transform: uppercase; font-weight: 500;
    color: var(--ink);
  }

  .cart-close {
    background: none; border: none;
    color: var(--ink); font-size: 19px;
    cursor: pointer; transition: opacity 0.2s;
    line-height: 1;
  }
  .cart-close:hover { opacity: 0.5; }

  .cart-items {
    flex: 1; overflow-y: auto;
    padding: 20px 26px;
    display: flex; flex-direction: column; gap: 18px;
  }

  .cart-item {
    display: grid; grid-template-columns: 62px 1fr auto;
    gap: 14px; align-items: start;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line-soft);
  }

  .cart-item-img {
    width: 62px; height: 80px;
    object-fit: cover;
    background: var(--paper-soft);
  }

  .cart-item-info { display: flex; flex-direction: column; gap: 3px; }

  .cart-item-brand {
    font-size: 11px; letter-spacing: 0.14em;
    font-weight: 500;
    color: var(--ink); text-transform: uppercase;
  }

  .cart-item-detail {
    font-size: 10px; color: var(--muted);
    letter-spacing: 0.1em; text-transform: uppercase;
  }

  .cart-item-price {
    font-size: 12px; font-weight: 400; color: var(--ink);
    margin-top: 5px; font-variant-numeric: tabular-nums;
  }

  .cart-item-remove {
    background: none; border: none;
    color: var(--muted); font-size: 16px;
    cursor: pointer; transition: color 0.2s;
    padding: 0; line-height: 1;
  }
  .cart-item-remove:hover { color: var(--ink); }

  .cart-empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; color: var(--muted);
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  }

  .cart-empty-icon { font-size: 30px; opacity: 0.25; }

  .cart-footer {
    padding: 22px 26px;
    border-top: 1px solid var(--line);
  }

  .cart-total-row {
    display: flex; justify-content: space-between;
    align-items: baseline; margin-bottom: 18px;
  }

  .cart-total-label {
    font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--muted);
  }

  .cart-total-value {
    font-size: 18px; color: var(--ink);
    font-weight: 400; font-variant-numeric: tabular-nums;
  }

  .checkout-btn {
    width: 100%;
    background: var(--ink);
    color: var(--paper); border: 1px solid var(--ink);
    font-family: var(--font-body);
    font-size: 11px; font-weight: 400;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 16px; cursor: pointer;
    transition: opacity 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 9px;
  }
  .checkout-btn:hover { opacity: 0.82; }
  .checkout-btn:disabled {
    background: var(--paper); color: var(--muted);
    border-color: var(--line); cursor: not-allowed;
  }

  /* ── LOADING ── */
  .loading {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 50vh; gap: 18px;
  }

  .loading-ring {
    width: 34px; height: 34px;
    border: 1px solid var(--line);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading p {
    font-size: 10px; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--muted);
  }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 26px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: var(--paper);
    font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 13px 24px;
    transition: transform 0.3s;
    z-index: 500; white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── RESPONSIVO ── */
  @media (max-width: 860px) {
    .shell { display: block; }

    .sidebar {
      width: 100%;
      position: sticky; top: var(--header-h);
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(10px);
      z-index: 80;
    }

    .search-box { width: 100%; margin-bottom: 14px; }
    .side-label { display: none; }

    .cat-list {
      flex-direction: row;
      gap: 14px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .cat-list::-webkit-scrollbar { display: none; }

    .cat-item {
      border-left: none;
      border-bottom: 1px solid transparent;
      padding: 5px 0;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .cat-item.active { border-left-color: transparent; border-bottom-color: var(--ink); }

    .size-block { margin-top: 12px; }
    .size-head { margin-bottom: 8px; padding-right: 0; }
    .size-filter {
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      padding-right: 0;
      padding-bottom: 2px;
    }
    .size-filter::-webkit-scrollbar { display: none; }
    .size-chip { flex-shrink: 0; padding: 5px 9px; }

    .catalog { padding: 22px 16px 60px; }
  }

  @media (max-width: 520px) {
    header { padding: 0 16px; }
    .logo { font-size: 22px; letter-spacing: 3px; }
    .products-grid {
      grid-template-columns: repeat(2, 1fr);
      column-gap: 12px; row-gap: 32px;
    }
    .card-brand { font-size: 11px; }
    .card-cat { font-size: 9px; }
    .card-size { font-size: 9px; }
    .card-price { font-size: 11px; }
    .modal-content { padding: 28px 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  :focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
</style>

<body>

<!-- HEADER -->
<header>
  <a class="logo" href="#"><em>DR</em> <span>DAS GRIFES</span></a>
  <button class="cart-btn" onclick="toggleCart()">
    Sacola <span class="cart-count" id="cartCount">0</span>
  </button>
</header>

<div class="shell">

  <!-- SIDEBAR: CATEGORIAS + TAMANHOS -->
  <aside class="sidebar">
    <input class="search-box" type="text" placeholder="Buscar" oninput="searchProducts(this.value)" id="searchInput">
    <p class="eyebrow side-label">Categorias</p>
    <nav class="cat-list" id="catList">
      <button class="cat-item" id="btnTodos" onclick="filterCategoria('todos', this)">Todos</button>
    </nav>

    <div class="size-block" id="sizeBlock">
      <div class="size-head">
        <span class="eyebrow side-label" style="margin-bottom:0">Tamanho</span>
        <button class="size-clear" id="sizeClear" onclick="filterTamanho(null)">Limpar</button>
      </div>
      <div class="size-filter" id="sizeFilter"></div>
    </div>
  </aside>

  <!-- CATÁLOGO -->
  <main class="catalog">
    <div class="catalog-head">
      <span class="eyebrow" id="sectionTitle">Carregando produtos...</span>
    </div>
    <div class="products-grid" id="productsGrid">
      <div class="loading" style="grid-column:1/-1">
        <div class="loading-ring"></div>
        <p>Carregando catálogo</p>
      </div>
    </div>
  </main>

</div>

<!-- MODAL PRODUTO -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal">
    <img class="modal-img" id="modalImg" src="" alt="">
    <div class="modal-content">
      <div class="modal-name" id="modalName"></div>
      <div class="modal-cat" id="modalCat"></div>
      <div class="modal-cor" id="modalCor"></div>
      <div class="modal-ref" id="modalRef"></div>
      <div class="modal-price" id="modalPrice"></div>
      <div class="modal-label">Tamanho</div>
      <div class="sizes-grid" id="modalSizes"></div>
      <div class="modal-label">Quantidade</div>
      <div class="qty-row">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <span class="qty-display" id="qtyDisplay">1</span>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
      <button class="modal-add-btn" id="modalAddBtn" onclick="addToCart()">Adicionar à sacola</button>
    </div>
    <button class="modal-close" onclick="closeModal()">×</button>
  </div>
</div>

<!-- SACOLA -->
<div class="cart-overlay-bg" id="cartOverlayBg" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-header">
    <div class="cart-title">Sacola</div>
    <button class="cart-close" onclick="toggleCart()">×</button>
  </div>
  <div class="cart-items" id="cartItems">
    <div class="cart-empty">
      <div class="cart-empty-icon">🛍</div>
      <span>Sacola vazia</span>
    </div>
  </div>
  <div class="cart-footer">
    <div class="cart-total-row">
      <span class="cart-total-label">Total</span>
      <span class="cart-total-value" id="cartTotal">R$ 0,00</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn" onclick="sendWhatsApp()" disabled>
      Enviar pedido
    </button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────
// Fonte principal: aba Produtos publicada na web (CSV, rápido e com cache do Google)
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQfcGlQHJ_pJvswPsIh_Ihhw9JoO_Zanwj4eW1S4J2Tg5hPqAH9v2liZNQcN52yUus9_U27Ue55_eRl/pub?gid=0&single=true&output=csv';
// Reserva: Apps Script (usado só se o CSV falhar)
const API_URL = 'https://script.google.com/macros/s/AKfycbz7HqBhejEOHNELpM6TL9b1oaUXtTBZ3qPypWpEYcswmZBCpyM9C6AsWRH9giL0lh4ODA/exec';
const WHATSAPP = '5511978498705';

// ── ORDEM DAS CATEGORIAS ────────────────────────────────────────
// Quem estiver nesta lista aparece primeiro, nesta ordem.
// O resto entra depois, em ordem alfabética. Pode editar à vontade.
const ORDEM_CATEGORIAS = ['Camisetas', 'Calçados', 'Blusas-Casacos'];
// Categoria que abre selecionada quando o cliente entra ('todos' para abrir tudo)
const CATEGORIA_PADRAO = 'Camisetas';

// ── FILTRO DE TAMANHO ───────────────────────────────────────────
// 1) Tamanhos que NÃO entram no filtro (não são tamanho de verdade)
const TAMANHOS_SEM_FILTRO = ['unico', 'ajustavel', 'consultar', 'grande', 'sob consulta', 'tamanho unico'];

// 2) Numeração de roupa → letra. Editar aqui se entrar 58, 60 etc.
const EQUIV_NUMERICA = {
  '44': 'S',  '46': 'S',
  '48': 'M',  '50': 'M',
  '52': 'L',  '54': 'L',
  '56': 'XL'
};

// 3) Padroniza as letras no padrão internacional (S, M, L, XL, XXL...)
const SINONIMOS_TAMANHO = {
  'PP': 'XS',  'XS': 'XS',
  'P': 'S',    'S': 'S',
  'M': 'M',
  'G': 'L',    'L': 'L',
  'GG': 'XL',  'XL': 'XL',
  'XGG': 'XXL', 'XXL': 'XXL',
  'XGGG': 'XXXL', 'XXXL': 'XXXL',
  'XXXXL': 'XXXXL'
};

// 4) Categorias em que número é numeração própria (não vira letra)
const CATEGORIAS_NUMERACAO_PROPRIA = ['Calçados', 'Calcados'];

// 5) Ordem em que as letras aparecem nos botões
const ORDEM_LETRAS = ['XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL', 'XXXXL'];

// ── STATE ────────────────────────────────────────────────────────
let allProducts = [];
let filteredProducts = [];
let cart = [];
let currentProduct = null;
let currentQty = 1;
let currentSize = null;
let activeCategoria = 'todos';
let activeTamanho = null;
let searchTerm = '';
let categoriaInicialAplicada = false;

// ── LOAD DATA ────────────────────────────────────────────────────
// O catálogo abre na hora com a última versão salva no aparelho e
// atualiza em segundo plano. A chamada à planilha tem limite de tempo
// e tenta de novo sozinha, então ninguém precisa ficar dando F5.
const CACHE_KEY = 'dg_catalogo_v2';
let lastRowsJson = '';

// Lê CSV (aceita vírgulas e quebras de linha dentro de aspas)
function parseCSV(text) {
  const linhas = [];
  let linha = [], campo = '', aspas = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (aspas) {
      if (c === '"') {
        if (text[i + 1] === '"') { campo += '"'; i++; }
        else aspas = false;
      } else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === ',') { linha.push(campo); campo = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      linha.push(campo); linhas.push(linha); linha = []; campo = '';
    } else campo += c;
  }
  if (campo !== '' || linha.length) { linha.push(campo); linhas.push(linha); }
  if (!linhas.length) return [];
  const headers = linhas[0].map(h => h.trim().toLowerCase());
  return linhas.slice(1)
    .filter(r => r[0] && r[0].trim())
    .map(r => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = (r[i] || '').trim());
      return obj;
    });
}

async function baixar(url, tipo, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const sep = url.includes('?') ? '&' : '?';
    const res = await fetch(url + sep + 't=' + Math.floor(Date.now() / 60000), { signal: ctrl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = tipo === 'csv' ? parseCSV(await res.text()) : await res.json();
    if (!Array.isArray(data) || !data.length) throw new Error('Resposta inválida');
    return data;
  } finally {
    clearTimeout(timer);
  }
}

// Tenta o CSV (rápido); se falhar, tenta o Apps Script; repete algumas vezes
async function fetchComRetry(tentativas = 3) {
  let ultimoErro;
  for (let i = 0; i < tentativas; i++) {
    try { return await baixar(CSV_URL, 'csv', 10000); }
    catch (e) { ultimoErro = e; console.warn('CSV falhou (tentativa ' + (i + 1) + '):', e); }
    try { return await baixar(API_URL, 'json', 20000); }
    catch (e) { ultimoErro = e; console.warn('Apps Script falhou (tentativa ' + (i + 1) + '):', e); }
    if (i < tentativas - 1) {
      const t = document.getElementById('sectionTitle');
      if (!allProducts.length && t) t.textContent = 'Carregando produtos... (tentativa ' + (i + 2) + ')';
      await new Promise(r => setTimeout(r, 1000 * (i + 1)));
    }
  }
  throw ultimoErro;
}

// Compara nomes ignorando acento, caixa e espaços
function norm(s) {
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
}

// ── TAMANHOS: rótulo usado pelo filtro ───────────────────────────
// Devolve o rótulo do filtro para um tamanho, ou null se não filtrável
function rotuloTamanho(tam, categoria) {
  const bruto = String(tam || '').trim();
  if (!bruto) return null;
  if (TAMANHOS_SEM_FILTRO.includes(norm(bruto))) return null;

  const up = bruto.toUpperCase().replace(/\s+/g, '');

  // Número puro
  if (/^\d+$/.test(up)) {
    const numeracaoPropria = CATEGORIAS_NUMERACAO_PROPRIA.some(c => norm(c) === norm(categoria));
    if (numeracaoPropria) return up;          // calçado: 42 continua 42
    return EQUIV_NUMERICA[up] || up;          // roupa: 48 vira M
  }

  return SINONIMOS_TAMANHO[up] || up;         // letras padronizadas
}

// Todos os rótulos filtráveis de um produto
function rotulosDoProduto(p) {
  const out = [];
  (p.tamanhos || []).forEach(t => {
    const r = rotuloTamanho(t, p.cat);
    if (r && !out.includes(r)) out.push(r);
  });
  return out;
}

// Tamanhos reais (como estão no Drive) que correspondem a um rótulo
function tamanhosReaisPara(p, rotulo) {
  return (p.tamanhos || []).filter(t => rotuloTamanho(t, p.cat) === rotulo);
}

function processRows(rows) {
  const json = JSON.stringify(rows);
  if (json === lastRowsJson) return;   // nada mudou, não redesenha
  lastRowsJson = json;

  const produtos = {};

  for (const row of rows) {
    // Busca as colunas de forma flexível (case insensitive)
    const get = (obj, key) => {
      const k = Object.keys(obj).find(k => k.toLowerCase().includes(key));
      return k ? String(obj[k] || '').trim() : '';
    };

    const id    = get(row, 'id');
    const nome  = get(row, 'nome');
    const cat   = get(row, 'categoria');
    const marca = get(row, 'marca');
    const cor   = get(row, 'cor');
    const tam   = get(row, 'tamanho');
    const preco = get(row, 'pre');
    const foto  = get(row, 'foto');

    if (!nome || !foto) continue;

    // Agrupa por foto (mesmo produto, tamanhos diferentes)
    const key = foto;
    if (!produtos[key]) {
      produtos[key] = { id, nome, cat, marca, cor, preco, foto, tamanhos: [] };
    }
    if (tam && !produtos[key].tamanhos.includes(tam)) {
      produtos[key].tamanhos.push(tam);
    }
  }

  allProducts = Object.values(produtos);

  // Na primeira carga, abre já na categoria padrão (se ela existir)
  if (!categoriaInicialAplicada && allProducts.length) {
    categoriaInicialAplicada = true;
    if (norm(CATEGORIA_PADRAO) !== 'todos') {
      const achou = allProducts.find(p => norm(p.cat) === norm(CATEGORIA_PADRAO));
      if (achou) activeCategoria = achou.cat;
    }
  }

  if (activeCategoria !== 'todos' && !allProducts.some(p => p.cat === activeCategoria)) {
    activeCategoria = 'todos';
  }
  buildCategories();
  applyFilters();
}

async function loadProducts() {
  let temCache = false;
  try {
    const salvo = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (salvo && Array.isArray(salvo.rows) && salvo.rows.length) {
      processRows(salvo.rows);
      temCache = true;
    }
  } catch (e) { /* sem cache, segue */ }

  try {
    const rows = await fetchComRetry();
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), rows })); } catch (e) {}
    processRows(rows);
  } catch (e) {
    console.error(e);
    if (!temCache) {
      document.getElementById('productsGrid').innerHTML =
        '<div class="no-results">Não conseguimos carregar os produtos agora.<br><br>' +
        '<button class="btn-ghost" onclick="retryLoad()">Tentar de novo</button></div>';
      document.getElementById('sectionTitle').textContent = 'Erro';
    }
  }
}

function retryLoad() {
  document.getElementById('sectionTitle').textContent = 'Carregando produtos...';
  document.getElementById('productsGrid').innerHTML =
    '<div class="loading" style="grid-column:1/-1"><div class="loading-ring"></div><p>Carregando catálogo</p></div>';
  loadProducts();
}

// ── CATEGORIAS ───────────────────────────────────────────────────
// Prioridade definida em ORDEM_CATEGORIAS; o resto em ordem alfabética
function ordenarCategorias(cats) {
  const prio = ORDEM_CATEGORIAS.map(norm);
  return cats.slice().sort((a, b) => {
    const ia = prio.indexOf(norm(a));
    const ib = prio.indexOf(norm(b));
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return a.localeCompare(b, 'pt-BR');
  });
}

function buildCategories() {
  const cats = ordenarCategorias([...new Set(allProducts.map(p => p.cat).filter(Boolean))]);
  const lista = document.getElementById('catList');

  lista.querySelectorAll('.cat-item[data-cat]').forEach(b => b.remove());
  document.getElementById('btnTodos').classList.toggle('active', activeCategoria === 'todos');

  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-item' + (cat === activeCategoria ? ' active' : '');
    btn.dataset.cat = cat;
    btn.textContent = cat;
    btn.onclick = () => filterCategoria(cat, btn);
    lista.appendChild(btn);
  });
}

function filterCategoria(cat, btn) {
  activeCategoria = cat;
  activeTamanho = null;   // troca de categoria zera o tamanho
  document.querySelectorAll('.cat-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

// ── TAMANHOS: botões ─────────────────────────────────────────────
function ordenarTamanhos(lista) {
  const letras = lista.filter(t => !/^\d+$/.test(t));
  const numeros = lista.filter(t => /^\d+$/.test(t));

  letras.sort((a, b) => {
    const ia = ORDEM_LETRAS.indexOf(a);
    const ib = ORDEM_LETRAS.indexOf(b);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return a.localeCompare(b, 'pt-BR');
  });
  numeros.sort((a, b) => Number(a) - Number(b));

  return letras.concat(numeros);
}

function buildSizes() {
  // Considera categoria + busca, mas NÃO o tamanho selecionado
  const base = allProducts.filter(p => {
    const matchCat = activeCategoria === 'todos' || p.cat === activeCategoria;
    const matchSearch = !searchTerm ||
      p.nome.toLowerCase().includes(searchTerm) ||
      p.marca.toLowerCase().includes(searchTerm) ||
      p.cor.toLowerCase().includes(searchTerm);
    return matchCat && matchSearch;
  });

  const tamanhos = ordenarTamanhos([...new Set(base.flatMap(rotulosDoProduto))]);

  const bloco = document.getElementById('sizeBlock');
  const wrap = document.getElementById('sizeFilter');
  const clear = document.getElementById('sizeClear');

  // Se o tamanho ativo sumiu da lista, zera
  if (activeTamanho && !tamanhos.includes(activeTamanho)) activeTamanho = null;

  bloco.classList.toggle('show', tamanhos.length > 0);
  clear.classList.toggle('show', !!activeTamanho);

  wrap.innerHTML = tamanhos.map(t =>
    `<button class="size-chip${t === activeTamanho ? ' active' : ''}" onclick="filterTamanho('${t}')">${t}</button>`
  ).join('');
}

function filterTamanho(t) {
  // Clicar no que já está ativo desmarca
  activeTamanho = (t && t !== activeTamanho) ? t : null;
  applyFilters();
}

function searchProducts(val) {
  searchTerm = val.toLowerCase();
  applyFilters();
}

function applyFilters() {
  buildSizes();

  filteredProducts = allProducts.filter(p => {
    const matchCat = activeCategoria === 'todos' || p.cat === activeCategoria;
    const matchSearch = !searchTerm ||
      p.nome.toLowerCase().includes(searchTerm) ||
      p.marca.toLowerCase().includes(searchTerm) ||
      p.cor.toLowerCase().includes(searchTerm);
    const matchTam = !activeTamanho || rotulosDoProduto(p).includes(activeTamanho);
    return matchCat && matchSearch && matchTam;
  });
  renderProducts();
}

// ── RENDER ───────────────────────────────────────────────────────
function getDriveId(url) {
  const m = String(url).match(/\/d\/([\w-]+)/) || String(url).match(/[?&]id=([\w-]+)/);
  return m ? m[1] : null;
}

// Servidor de imagens do Google (bem mais rápido que o thumbnail do Drive)
function getDriveThumb(url) {
  const id = getDriveId(url);
  if (id) return `https://lh3.googleusercontent.com/d/${id}=w600`;
  return url;
}

const IMG_PLACEHOLDER = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><rect fill="#f4f3f1" width="300" height="400"/><text x="150" y="210" fill="#c9c6c2" text-anchor="middle" font-size="40">👕</text></svg>');

// Se a imagem falhar: tenta o thumbnail do Drive, depois o placeholder
function imgFallback(img) {
  const id = getDriveId(img.dataset.src || '');
  const step = Number(img.dataset.step || 0);
  img.dataset.step = step + 1;
  if (step === 0 && id) img.src = `https://drive.google.com/thumbnail?id=${id}&sz=w600`;
  else { img.onerror = null; img.src = IMG_PLACEHOLDER; }
}

// Converte "1.500,00", "1.500", "R$ 150,00", "150.5" ou 150 em número
function parsePrice(val) {
  if (typeof val === 'number') return val;
  let s = String(val || '').replace(/[^\d.,-]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');      // 1.600,00 -> 1600.00
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');  // 1.600 -> 1600
  return parseFloat(s);
}

function hasPrice(val) {
  return !isNaN(parsePrice(val));
}

function formatPrice(val) {
  const n = parsePrice(val);
  if (isNaN(n)) return 'Consulte';
  return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function renderProducts() {
  const grid = document.getElementById('productsGrid');
  const title = document.getElementById('sectionTitle');

  const nomeCat = activeCategoria === 'todos' ? 'Todos' : activeCategoria;
  const sufixoTam = activeTamanho ? ` · Tam. ${activeTamanho}` : '';
  title.textContent = `${nomeCat}${sufixoTam} — ${filteredProducts.length} ${filteredProducts.length !== 1 ? 'peças' : 'peça'}`;

  if (!filteredProducts.length) {
    grid.innerHTML = '<div class="no-results">Nenhum produto encontrado</div>';
    return;
  }

  grid.innerHTML = filteredProducts.map((p, i) => {
    // Com filtro ativo, mostra o tamanho real da peça (ex.: M · 48)
    let linhaTam = '';
    if (activeTamanho) {
      const reais = tamanhosReaisPara(p, activeTamanho);
      const extras = reais.filter(t => t.toUpperCase().replace(/\s+/g, '') !== activeTamanho);
      linhaTam = `<div class="card-size">${activeTamanho}${extras.length ? ' · ' + extras.join(' · ') : ''}</div>`;
    }
    return `
    <article class="product-card" onclick="openModal(${i})" style="animation: fadeIn 0.4s ease ${(i % 12) * 0.03}s both">
      <div class="card-media">
        <img src="${getDriveThumb(p.foto)}" data-src="${p.foto}" alt="${p.marca || p.cat}" loading="lazy" decoding="async" onerror="imgFallback(this)">
      </div>
      <div class="card-meta">
        <div class="card-brand">${p.marca || p.cat}</div>
        <div class="card-cat">${p.cat}</div>
        ${linhaTam}
        <div class="card-price${hasPrice(p.preco) ? '' : ' consult'}">${formatPrice(p.preco)}</div>
      </div>
    </article>
  `;
  }).join('');
}

// ── MODAL ────────────────────────────────────────────────────────
function openModal(idx) {
  currentProduct = filteredProducts[idx];
  currentQty = 1;
  currentSize = null;

  const mImg = document.getElementById('modalImg');
  mImg.dataset.step = 0;
  mImg.dataset.src = currentProduct.foto;
  mImg.onerror = () => imgFallback(mImg);
  mImg.src = getDriveThumb(currentProduct.foto);
  document.getElementById('modalName').textContent = currentProduct.marca || currentProduct.cat;
  document.getElementById('modalCat').textContent = currentProduct.cat;
  document.getElementById('modalCor').innerHTML = currentProduct.cor
    ? `Cor: <strong>${currentProduct.cor}</strong>` : '';
  document.getElementById('modalRef').textContent = currentProduct.nome || '';
  document.getElementById('modalPrice').textContent = formatPrice(currentProduct.preco);
  document.getElementById('qtyDisplay').textContent = 1;

  // Se veio de um filtro de tamanho, já deixa esse tamanho marcado
  let preSelecionado = null;
  if (activeTamanho) {
    const reais = tamanhosReaisPara(currentProduct, activeTamanho);
    if (reais.length === 1) preSelecionado = reais[0];
  }

  const sizesEl = document.getElementById('modalSizes');
  if (currentProduct.tamanhos.length > 0) {
    sizesEl.innerHTML = currentProduct.tamanhos.map(t => `
      <button class="size-btn${t === preSelecionado ? ' selected' : ''}" onclick="selectSize('${t}', this)">${t}</button>
    `).join('');
    if (preSelecionado) currentSize = preSelecionado;
  } else {
    sizesEl.innerHTML = '<span style="color:var(--muted);font-size:11px;letter-spacing:0.14em;text-transform:uppercase">Tamanho único</span>';
    currentSize = 'ÚNICO';
  }

  updateAddBtn();
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function selectSize(size, btn) {
  currentSize = size;
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  updateAddBtn();
}

function updateAddBtn() {
  const btn = document.getElementById('modalAddBtn');
  btn.disabled = !currentSize;
  btn.textContent = currentSize ? 'Adicionar à sacola' : 'Selecione um tamanho';
}

function changeQty(delta) {
  currentQty = Math.max(1, currentQty + delta);
  document.getElementById('qtyDisplay').textContent = currentQty;
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

// ── CART ─────────────────────────────────────────────────────────
function addToCart() {
  if (!currentProduct || !currentSize) return;

  const key = `${currentProduct.foto}|${currentSize}`;
  const existing = cart.find(i => i.key === key);

  if (existing) {
    existing.qty += currentQty;
  } else {
    cart.push({
      key,
      nome: currentProduct.cor,
      produto: currentProduct.nome,
      marca: currentProduct.marca || currentProduct.cat,
      cat: currentProduct.cat,
      cor: currentProduct.cor,
      tamanho: currentSize,
      preco: parsePrice(currentProduct.preco) || 0,
      foto: currentProduct.foto,
      qty: currentQty
    });
  }

  if (typeof fbq === 'function') fbq('track', 'AddToCart');

  updateCartUI();
  closeModal();
  showToast(`${currentProduct.marca || currentProduct.cat} na sacola`);
}

function removeFromCart(key) {
  cart = cart.filter(i => i.key !== key);
  updateCartUI();
}

function updateCartUI() {
  const count = cart.reduce((s, i) => s + i.qty, 0);
  const total = cart.reduce((s, i) => s + i.preco * i.qty, 0);

  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent =
    total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

  const btn = document.getElementById('checkoutBtn');
  btn.disabled = cart.length === 0;

  const itemsEl = document.getElementById('cartItems');
  if (!cart.length) {
    itemsEl.innerHTML = `<div class="cart-empty"><div class="cart-empty-icon">🛍</div><span>Sacola vazia</span></div>`;
    return;
  }

  itemsEl.innerHTML = cart.map(item => `
    <div class="cart-item">
      <img class="cart-item-img" src="${getDriveThumb(item.foto)}" data-src="${item.foto}" alt="${item.marca}" onerror="imgFallback(this)">
      <div class="cart-item-info">
        <div class="cart-item-brand">${item.marca}</div>
        <div class="cart-item-detail">${item.cat}${item.cor ? ' · ' + item.cor : ''}</div>
        <div class="cart-item-detail">${item.tamanho} · ${item.qty} un.</div>
        <div class="cart-item-price">${(item.preco * item.qty).toLocaleString('pt-BR', {style:'currency',currency:'BRL'})}</div>
      </div>
      <button class="cart-item-remove" onclick="removeFromCart('${item.key}')">×</button>
    </div>
  `).join('');
}

function toggleCart() {
  const sidebar = document.getElementById('cartSidebar');
  const bg = document.getElementById('cartOverlayBg');
  sidebar.classList.toggle('open');
  bg.classList.toggle('open');
}

// ── WHATSAPP ─────────────────────────────────────────────────────
function sendWhatsApp() {
  if (!cart.length) return;

  const total = cart.reduce((s, i) => s + i.preco * i.qty, 0);
  let msg = '🛍 *NOVO PEDIDO — DR DAS GRIFES*\n';
  msg += '━━━━━━━━━━━━━━━━━━\n\n';

  cart.forEach((item, i) => {
    msg += `*${i+1}. ${item.marca} — ${item.cat}*\n`;
    if (item.cor) msg += `   Cor: ${item.cor}\n`;
    msg += `   Tamanho: ${item.tamanho}\n`;
    msg += `   Qtd: ${item.qty}x\n`;
    msg += `   Valor: ${(item.preco * item.qty).toLocaleString('pt-BR', {style:'currency',currency:'BRL'})}\n\n`;
  });

  msg += '━━━━━━━━━━━━━━━━━━\n';
  msg += `💰 *TOTAL: ${total.toLocaleString('pt-BR', {style:'currency',currency:'BRL'})}*\n\n`;
  msg += '_Por favor, confirme seu nome e endereço para entrega._';

  if (typeof fbq === 'function') fbq('track', 'Lead');

  const url = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

// ── TOAST ────────────────────────────────────────────────────────
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ── INIT ─────────────────────────────────────────────────────────
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

const style = document.createElement('style');
style.textContent = '@keyframes fadeIn { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }';
document.head.appendChild(style);

loadProducts();
</script>
